<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto Nota Fiscal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login">
        <!-- Cabeçalho com o Logotipo e Título -->
        <div class="topo-cabecalho-central">
            <img src="logotipo da nota fiscal.png" alt="Logotipo" class="logo-simbolo-central">
            <h2>Login do Sistema</h2>
        </div>

        <!-- Formulário com todos os campos exigidos -->
        <form action="home.html" method="post">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required>

            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha" required>

            <button type="submit">Entrar</button>

            <p>Não tem uma conta? <a href="cad_usuario.html">Cadastra-se</a></p>
        </form>
    </main>
</body>
</html>
