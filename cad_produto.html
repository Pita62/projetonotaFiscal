<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="form-container">
        <div class="topo-cabecalho-central">
            <img src="image/logo_cadeados.png" alt="Logotipo" class="logo-simbolo-central">
            <h2>Cadastro do Produto</h2>
        </div>

        <form action="#" method="post">
            <label for="nm_produto">Nome do produto</label>
            <input type="text" name="nm_produto" id="nm_produto" required>

            <label for="vl_unitario">Valor Unitário</label>
            <input type="number" step="0.01" name="vl_unitario" id="vl_unitario" required>

            <div class="botoes-acao">
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
                <a href="home.html" class="btn-menu-voltar">Menu</a>
            </div>
        </form>
    </main>
</body>
</html>
