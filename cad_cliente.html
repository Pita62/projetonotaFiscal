<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="form-container">
        <div class="topo-cabecalho-central">
            <img src="image/logo_cadeados.png" alt="Logotipo" class="logo-simbolo-central">
            <h2>Cadastro do Cliente</h2>
        </div>

        <form action="#" method="post">
            <label for="nr_cnpj">Número do CNPJ</label>
            <input type="text" name="nr_cnpj" id="nr_cnpj" required>

            <label for="nm_razao_social">Razão Social</label>
            <input type="text" name="nm_razao_social" id="nm_razao_social" required>

            <label for="nm_pais">País</label>
            <input type="text" name="nm_pais" id="nm_pais" required>

            <label for="nm_email">Email</label>
            <input type="email" name="nm_email" id="nm_email" required>

            <div class="botoes-acao">
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
                <a href="home.html" class="btn-menu-voltar">Menu</a>
            </div>
        </form>
    </main>
</body>
</html>
